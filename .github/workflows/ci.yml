name: CI

on:
  push:
    branches: [master, claude/*]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format cppcheck

      - name: Check code formatting
        run: |
          clang-format --dry-run --Werror src/cc-bash.c tests/test_unit.c

      - name: Build cc-bash
        run: make

      - name: Build with strict warnings
        run: make clean && make STRICT=1

      - name: Run static analysis
        run: make lint

      - name: Build and run tests
        run: make test
        env:
          TERM: xterm

      - name: Verify install target works
        run: |
          make install PREFIX=$HOME/.local
          test -x $HOME/.local/bin/cc-bash
          $HOME/.local/bin/cc-bash -c "echo test" || true

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build cc-bash
        run: make

      - name: Build with strict warnings
        run: make clean && make STRICT=1

      - name: Run tests
        run: make test
        env:
          TERM: xterm
